services:
  ballot:
    build: ./ballot
    ports:
      - "5000:80"
    depends_on:
      redis:
        condition: service_healthy

  tally:
    build: ./tally
    ports:
      - "5001:80"
    depends_on:
      db:
        condition: service_healthy

  counter:
    build: ./counter
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s

volumes:
  pgdata:
